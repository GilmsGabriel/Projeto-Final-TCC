name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/escola.agendamento

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: Backend/escola.agendamento/pom.xml

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Build with Maven Wrapper
      run: ./mvnw clean install
